<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gymly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            accent: '#22c55e',
            surface: '#1e293b',
            surface2: '#334155',
            bg: '#0f172a',
          },
        },
      },
    };
  </script>
  <style>
    html, body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .safe-top {
      padding-top: calc(env(safe-area-inset-top, 0) + var(--safe-top-offset, 56px));
    }
    /* Отступ снизу, чтобы контент не залезал под навигацию */
    .content-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0) + 90px); }
    .hidden-screen { display: none; }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    body.mobile-body {
      overflow: hidden;
      height: 100vh;
      position: fixed;
      width: 100%;
    }
    body.mobile-body #wrap {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      height: calc(100% + 1px);
    }
  </style>
</head>
<body class="bg-bg text-white font-sans min-h-screen">

  <div id="wrap">
    <div class="max-w-md mx-auto px-4 safe-top content-bottom">

      <!-- ЭКРАН 1: ГЛАВНАЯ -->
      <div id="screen-home">
        <header class="mb-6">
          <p class="text-slate-400 text-sm">Привет,</p>
          <h1 id="user-name" class="text-2xl font-bold">Гость</h1>
        </header>

        <button id="start-workout"
                class="w-full bg-primary hover:bg-indigo-500 active:scale-[0.98] transition
                       rounded-2xl p-5 mb-6 text-left flex items-center justify-between">
          <div>
            <p class="start-subtitle text-xs uppercase tracking-wide text-indigo-200">Новая сессия</p>
            <p class="start-title text-xl font-semibold">Начать тренировку</p>
          </div>
          <span class="start-icon text-3xl">🏋️</span>
        </button>

        <section>
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-semibold">Последние тренировки</h2>
          </div>
          <div id="recent-list" class="space-y-3">
            <p class="text-slate-500 text-sm py-4 text-center">Загрузка...</p>
          </div>
        </section>
      </div>

      <!-- ЭКРАН 2: ТРЕНИРОВКА -->
      <div id="screen-workout" class="hidden-screen">
        <header class="flex items-center gap-3 mb-4">
          <button id="workout-back" class="text-slate-300 text-2xl leading-none">←</button>
          <h1 class="text-xl font-bold">Тренировка</h1>
        </header>

        <input id="exercise-search" type="text" placeholder="🔍 Поиск упражнения..."
               class="w-full bg-surface border border-slate-700 rounded-xl px-4 py-3 mb-3
                      text-white placeholder-slate-500 focus:outline-none focus:border-primary">

        <div id="exercises-picker" class="space-y-2 mb-6">
          <p class="text-slate-500 text-center py-4 text-sm">Загрузка...</p>
        </div>

        <div id="workout-divider" class="hidden border-t border-slate-700 my-6"></div>

        <h2 id="workout-header" class="hidden text-xs uppercase tracking-wide text-slate-500 mb-3">
          В тренировке
        </h2>
        <div id="workout-exercises" class="space-y-4"></div>

        <button id="finish-workout"
                class="hidden w-full mt-6 bg-red-600/20 hover:bg-red-600/30 active:scale-[0.98]
                       transition rounded-xl py-3 font-semibold text-red-300 border border-red-600/40">
          Завершить тренировку
        </button>
      </div>

      <!-- ЭКРАН 3: ИСТОРИЯ -->
      <div id="screen-history" class="hidden-screen">
        <header class="mb-4">
          <h1 class="text-xl font-bold">История тренировок</h1>
        </header>
        <div id="history-list" class="space-y-3">
          <p class="text-slate-500 text-center py-8">Загрузка...</p>
        </div>
      </div>

      <!-- ЭКРАН 4: ДЕТАЛИ ТРЕНИРОВКИ -->
      <div id="screen-workout-detail" class="hidden-screen">
        <header class="flex items-center gap-3 mb-4">
          <button id="back-to-history" class="text-slate-300 text-2xl leading-none">←</button>
          <h1 id="detail-title" class="text-xl font-bold">Тренировка</h1>
        </header>
        <div id="detail-content" class="space-y-3"></div>
      </div>

      <!-- ЭКРАН 5: ПРОФИЛЬ -->
      <div id="screen-profile" class="hidden-screen">
        <header class="mb-6">
          <p class="text-slate-400 text-sm">Профиль</p>
          <h1 id="profile-name" class="text-2xl font-bold">Гость</h1>
          <p id="profile-username" class="text-sm text-slate-500"></p>
        </header>

        <div class="bg-gradient-to-br from-orange-500/20 to-red-500/20 border border-orange-500/30
                    rounded-2xl p-5 mb-4">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-xs uppercase tracking-wide text-orange-300">Дней подряд</p>
              <p id="stat-streak" class="text-4xl font-bold mt-1">0</p>
            </div>
            <span class="text-5xl">🔥</span>
          </div>
          <p id="streak-hint" class="text-xs text-orange-200/70 mt-2"></p>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="bg-surface rounded-2xl p-4">
            <p class="text-xs uppercase tracking-wide text-slate-500">Тренировок</p>
            <p id="stat-workouts" class="text-2xl font-bold mt-1">0</p>
          </div>
          <div class="bg-surface rounded-2xl p-4">
            <p class="text-xs uppercase tracking-wide text-slate-500">Подходов</p>
            <p id="stat-sets" class="text-2xl font-bold mt-1">0</p>
          </div>
        </div>

        <div class="bg-surface rounded-2xl p-4 mb-4">
          <p class="text-xs uppercase tracking-wide text-slate-500">Общий тоннаж</p>
          <p id="stat-volume" class="text-2xl font-bold mt-1">0 т</p>
          <p class="text-xs text-slate-500 mt-1">Сумма вес × повторы за всё время</p>
        </div>

        <p class="text-xs text-slate-500 text-center mt-8">Gymly · v0.1</p>
      </div>

    </div>
  </div>

  <!-- НИЖНЯЯ НАВИГАЦИЯ — ВСЕГДА ВИДНА -->
  <nav id="bottom-nav"
       class="fixed bottom-0 left-0 right-0 bg-surface/95 backdrop-blur border-t border-slate-700
              max-w-md mx-auto grid grid-cols-3 z-50">
    <button id="nav-home" class="py-3 text-center">
      <span class="block text-xl">🏠</span>
      <span class="nav-label text-xs text-slate-400">Главная</span>
    </button>
    <button id="nav-history" class="py-3 text-center">
      <span class="block text-xl">📊</span>
      <span class="nav-label text-xs text-slate-400">История</span>
    </button>
    <button id="nav-profile" class="py-3 text-center">
      <span class="block text-xl">👤</span>
      <span class="nav-label text-xs text-slate-400">Профиль</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
