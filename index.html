<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gymly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#7c6cff',
            primary2: '#a78bfa',
            accent: '#34d399',
            surface: '#1a1a24',
            surface2: '#252533',
            bg: '#0a0a0f',
            muted: '#8b8b9e',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    html, body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body { font-feature-settings: "cv11", "ss01"; }

    .safe-top {
      padding-top: calc(env(safe-area-inset-top, 0) + var(--safe-top-offset, 56px));
    }
    .content-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0) + 100px); }
    .hidden-screen { display: none; }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    body.mobile-body {
      overflow: hidden;
      height: 100vh;
      position: fixed;
      width: 100%;
    }
    body.mobile-body #wrap {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      height: calc(100% + 1px);
    }

    /* Красивое подсвечивание активной вкладки */
    .nav-btn { transition: color .15s ease; color: #6e6e85; }
    .nav-btn.active { color: #7c6cff; }
    .nav-btn.active .nav-icon-bg {
      background: radial-gradient(circle, rgba(124,108,255,.22) 0%, rgba(124,108,255,0) 70%);
    }
    .nav-icon-bg {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 9999px;
      margin: 0 auto 2px;
      transition: background .2s ease;
    }

    /* Мягкая тень для карточек */
    .card-shadow { box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 24px rgba(0,0,0,0.25); }

    /* Плавные появления */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #wrap > div > div { animation: fadeIn .2s ease; }
  </style>
</head>
<body class="bg-bg text-white font-sans min-h-screen">

  <div id="wrap">
    <div class="max-w-md mx-auto px-5 safe-top content-bottom">

      <!-- ЭКРАН 1: ГЛАВНАЯ -->
      <div id="screen-home">
        <header class="mb-8">
          <p class="text-muted text-sm mb-1">Привет,</p>
          <h1 id="user-name" class="text-3xl font-bold tracking-tight">Гость</h1>
        </header>

        <button id="start-workout"
                class="w-full active:scale-[0.98] transition-transform
                       rounded-3xl p-6 mb-8 text-left flex items-center justify-between
                       card-shadow relative overflow-hidden"
                style="background: linear-gradient(135deg, #7c6cff 0%, #5b4dd6 100%);">
          <div class="relative z-10">
            <p class="start-subtitle text-xs uppercase tracking-wider text-white/70 mb-1">Новая сессия</p>
            <p class="start-title text-xl font-semibold">Начать тренировку</p>
          </div>
          <span class="start-icon text-3xl relative z-10">🏋️</span>
          <div class="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-white/10 blur-2xl"></div>
        </button>

        <section>
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-semibold">Последние тренировки</h2>
          </div>
          <div id="recent-list" class="space-y-3">
            <p class="text-muted text-sm py-4 text-center">Загрузка...</p>
          </div>
        </section>
      </div>

      <!-- ЭКРАН 2: ТРЕНИРОВКА -->
      <div id="screen-workout" class="hidden-screen">
        <header class="flex items-center gap-3 mb-6">
          <button id="workout-back" class="text-muted p-2 -ml-2 active:opacity-60">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <h1 class="text-xl font-bold tracking-tight">Тренировка</h1>
        </header>

        <div class="relative mb-5">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-muted pointer-events-none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="exercise-search" type="text" placeholder="Поиск упражнения..."
                 class="w-full bg-surface border border-white/5 rounded-2xl pl-11 pr-4 py-3.5
                        text-white placeholder-muted focus:outline-none focus:border-primary/50
                        focus:ring-1 focus:ring-primary/30 transition">
        </div>

        <div id="exercises-picker" class="space-y-2 mb-6">
          <p class="text-muted text-center py-4 text-sm">Загрузка...</p>
        </div>

        <div id="workout-divider" class="hidden border-t border-white/5 my-6"></div>

        <h2 id="workout-header" class="hidden text-xs uppercase tracking-wider text-muted mb-3">
          В тренировке
        </h2>
        <div id="workout-exercises" class="space-y-4"></div>

        <button id="finish-workout"
                class="hidden w-full mt-8 bg-red-500/10 hover:bg-red-500/15 active:scale-[0.98]
                       transition rounded-2xl py-3.5 font-semibold text-red-300/90 border border-red-500/20">
          Завершить тренировку
        </button>
      </div>

      <!-- ЭКРАН 3: ИСТОРИЯ -->
      <div id="screen-history" class="hidden-screen">
        <header class="mb-6">
          <h1 class="text-2xl font-bold tracking-tight">История</h1>
        </header>
        <div id="history-list" class="space-y-3">
          <p class="text-muted text-center py-8">Загрузка...</p>
        </div>
      </div>

      <!-- ЭКРАН 4: ДЕТАЛИ ТРЕНИРОВКИ -->
      <div id="screen-workout-detail" class="hidden-screen">
        <header class="flex items-center gap-3 mb-6">
          <button id="back-to-history" class="text-muted p-2 -ml-2 active:opacity-60">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <h1 id="detail-title" class="text-xl font-bold tracking-tight">Тренировка</h1>
        </header>
        <div id="detail-content" class="space-y-3"></div>
      </div>

      <!-- ЭКРАН 5: ПРОФИЛЬ -->
      <div id="screen-profile" class="hidden-screen">
        <header class="mb-8">
          <p class="text-muted text-sm mb-1">Профиль</p>
          <h1 id="profile-name" class="text-3xl font-bold tracking-tight">Гость</h1>
          <p id="profile-username" class="text-sm text-muted mt-1"></p>
        </header>

        <div class="rounded-3xl p-6 mb-5 card-shadow relative overflow-hidden"
             style="background: linear-gradient(135deg, rgba(249,115,22,.15) 0%, rgba(239,68,68,.12) 100%); border: 1px solid rgba(249,115,22,.2);">
          <div class="flex items-center justify-between relative z-10">
            <div>
              <p class="text-xs uppercase tracking-wider text-orange-300/80">Дней подряд</p>
              <p id="stat-streak" class="text-5xl font-bold mt-2 tracking-tight">0</p>
            </div>
            <span class="text-6xl">🔥</span>
          </div>
          <p id="streak-hint" class="text-xs text-orange-200/60 mt-3 relative z-10"></p>
          <div class="absolute -right-10 -bottom-10 w-40 h-40 rounded-full bg-orange-500/10 blur-2xl"></div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-5">
          <div class="bg-surface rounded-2xl p-5 border border-white/5 card-shadow">
            <p class="text-xs uppercase tracking-wider text-muted">Тренировок</p>
            <p id="stat-workouts" class="text-3xl font-bold mt-2 tracking-tight">0</p>
          </div>
          <div class="bg-surface rounded-2xl p-5 border border-white/5 card-shadow">
            <p class="text-xs uppercase tracking-wider text-muted">Подходов</p>
            <p id="stat-sets" class="text-3xl font-bold mt-2 tracking-tight">0</p>
          </div>
        </div>

        <div class="bg-surface rounded-2xl p-5 border border-white/5 card-shadow">
          <p class="text-xs uppercase tracking-wider text-muted">Общий тоннаж</p>
          <p id="stat-volume" class="text-3xl font-bold mt-2 tracking-tight">0 т</p>
          <p class="text-xs text-muted mt-2">Сумма вес × повторы за всё время</p>
        </div>

        <p class="text-xs text-muted/60 text-center mt-10">Gymly · v0.1</p>
      </div>

    </div>
  </div>

  <!-- НИЖНЯЯ НАВИГАЦИЯ С SVG-ИКОНКАМИ -->
  <nav id="bottom-nav"
       class="fixed bottom-0 left-0 right-0 border-t border-white/5
              max-w-md mx-auto grid grid-cols-3 z-50"
       style="background: rgba(15,15,22,.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);">
    <button id="nav-home" class="nav-btn active py-3">
      <div class="nav-icon-bg">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a2 2 0 01-2 2h-3v-7h-8v7H5a2 2 0 01-2-2V9.5z"/>
        </svg>
      </div>
      <span class="nav-label text-[11px] font-medium">Главная</span>
    </button>
    <button id="nav-history" class="nav-btn py-3">
      <div class="nav-icon-bg">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/>
          <path d="M7 14l3-3 3 3 5-6"/>
        </svg>
      </div>
      <span class="nav-label text-[11px] font-medium">История</span>
    </button>
    <button id="nav-profile" class="nav-btn py-3">
      <div class="nav-icon-bg">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21v-1a6 6 0 016-6h4a6 6 0 016 6v1"/>
        </svg>
      </div>
      <span class="nav-label text-[11px] font-medium">Профиль</span>
    </button>
  </nav>

  <script>
    // Версионирование app.js — сбрасывает кэш при каждом обновлении
    document.write('<script src="app.js?v=' + Date.now() + '"><\/script>');
  </script>
</body>
</html>
